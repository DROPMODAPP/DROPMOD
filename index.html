<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DROP MOD</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <!-- App Container -->
    <div id="app" class="flex-1 flex flex-col max-w-md mx-auto w-full bg-slate-900 shadow-2xl overflow-hidden relative">
        <!-- Dynamic Content -->
    </div>

    <script>
        const STORAGE_KEY = 'drop_mod_data_v1';
        let state = {
            loggedUser: null,
            users: JSON.parse(localStorage.getItem(STORAGE_KEY + '_users')) || [{ username: 'admin', pin: '1234', role: 'admin', recoveryKey: 'DROP2026' }],
            products: JSON.parse(localStorage.getItem(STORAGE_KEY + '_products')) || [],
            customers: JSON.parse(localStorage.getItem(STORAGE_KEY + '_customers')) || [],
            currentTab: 'dashboard'
        };

        function saveState() {
            localStorage.setItem(STORAGE_KEY + '_users', JSON.stringify(state.users));
            localStorage.setItem(STORAGE_KEY + '_products', JSON.stringify(state.products));
            localStorage.setItem(STORAGE_KEY + '_customers', JSON.stringify(state.customers));
        }

        function render() {
            const app = document.getElementById('app');
            if (!state.loggedUser) {
                app.innerHTML = renderLogin();
                return;
            }

            app.innerHTML = `
                <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center">
                    <div>
                        <h1 class="font-bold text-lg text-emerald-400 flex items-center gap-2"><i class="fa-solid fa-box-open"></i> DROP MOD</h1>
                        <p class="text-xs text-slate-400">Operador: <span class="text-slate-200 font-semibold">${state.loggedUser.username}</span></p>
                    </div>
                    <button onclick="logout()" class="text-xs bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg font-medium transition"><i class="fa-solid fa-power-off"></i> Sair</button>
                </header>

                <main class="flex-1 overflow-y-auto p-4 pb-20">
                    ${state.currentTab === 'dashboard' ? renderDashboard() : ''}
                    ${state.currentTab === 'inventory' ? renderInventory() : ''}
                    ${state.currentTab === 'notebook' ? renderNotebook() : ''}
                    ${state.currentTab === 'system' ? renderSystem() : ''}
                </main>

                <nav class="absolute bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 flex justify-around p-3 text-xs">
                    <button onclick="switchTab('dashboard')" class="flex flex-col items-center gap-1 ${state.currentTab === 'dashboard' ? 'text-emerald-400 font-bold' : 'text-slate-400 hover:text-slate-200'}">
                        <i class="fa-solid fa-chart-pie text-base"></i> Início
                    </button>
                    <button onclick="switchTab('inventory')" class="flex flex-col items-center gap-1 ${state.currentTab === 'inventory' ? 'text-emerald-400 font-bold' : 'text-slate-400 hover:text-slate-200'}">
                        <i class="fa-solid fa-boxes-stacked text-base"></i> Estoque
                    </button>
                    <button onclick="switchTab('notebook')" class="flex flex-col items-center gap-1 ${state.currentTab === 'notebook' ? 'text-emerald-400 font-bold' : 'text-slate-400 hover:text-slate-200'}">
                        <i class="fa-solid fa-book text-base"></i> Caderneta
                    </button>
                    <button onclick="switchTab('system')" class="flex flex-col items-center gap-1 ${state.currentTab === 'system' ? 'text-emerald-400 font-bold' : 'text-slate-400 hover:text-slate-200'}">
                        <i class="fa-solid fa-gear text-base"></i> Sistema
                    </button>
                </nav>
            `;
        }

        function renderLogin() {
            return `
                <div class="flex-1 flex flex-col justify-center p-6 bg-slate-900">
                    <div class="text-center mb-8">
                        <div class="mb-3 flex justify-center">
                            <img src="icon-192.png" alt="Drop Mod" class="w-20 h-20 rounded-2xl shadow-lg object-cover border border-slate-700">
                        </div>
                        <h1 class="text-2xl font-bold text-white">DROP MOD</h1>
                        <p class="text-xs text-slate-400 mt-1">Controle de Estoque & Caderneta</p>
                    </div>
                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Usuário</label>
                            <input type="text" id="loginUser" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-emerald-500 text-white" placeholder="Ex: admin">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">PIN / Senha</label>
                            <input type="password" id="loginPin" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-emerald-500 text-white" placeholder="Ex: 1234">
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold p-3 rounded-lg transition text-sm shadow-lg shadow-emerald-900/40">Entrar no Sistema</button>
                    </form>
                    <div class="mt-6 text-center">
                        <button onclick="showRecoveryModal()" class="text-xs text-emerald-400 hover:underline">Esqueceu o PIN / Chave de Recuperação?</button>
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPin').value.trim();
            const found = state.users.find(x => x.username === u && x.pin === p);
            if (found) {
                state.loggedUser = found;
                render();
            } else {
                alert('Usuário ou PIN incorretos!');
            }
        }

        function logout() {
            state.loggedUser = null;
            render();
        }

        function switchTab(tab) {
            state.currentTab = tab;
            render();
        }

        function renderDashboard() {
            const totalProducts = state.products.reduce((acc, p) => acc + parseInt(p.qty || 0), 0);
            const totalStockValue = state.products.reduce((acc, p) => acc + (parseFloat(p.cost || 0) * parseInt(p.qty || 0)), 0);
            const totalDebt = state.customers.reduce((acc, c) => acc + parseFloat(c.debt || 0), 0);

            return `
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                            <p class="text-xs text-slate-400">Itens em Estoque</p>
                            <p class="text-2xl font-bold text-emerald-400 mt-1">${totalProducts}</p>
                        </div>
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                            <p class="text-xs text-slate-400">Valor em Custo</p>
                            <p class="text-xl font-bold text-blue-400 mt-1">R$ ${totalStockValue.toFixed(2)}</p>
                        </div>
                    </div>
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                        <p class="text-xs text-slate-400">Total em Fiados (Caderneta)</p>
                        <p class="text-2xl font-bold text-rose-400 mt-1">R$ ${totalDebt.toFixed(2)}</p>
                    </div>
                    <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700/60 text-xs text-slate-300 space-y-2">
                        <p class="font-semibold text-emerald-400"><i class="fa-solid fa-circle-info"></i> Atalhos Rápidos</p>
                        <div class="flex gap-2 pt-1">
                            <button onclick="switchTab('inventory')" class="flex-1 bg-slate-700 hover:bg-slate-600 p-2 rounded-lg text-center transition">Novo Produto</button>
                            <button onclick="switchTab('notebook')" class="flex-1 bg-slate-700 hover:bg-slate-600 p-2 rounded-lg text-center transition">Novo Fiado</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderInventory() {
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="font-bold text-base text-slate-200">Gerenciar Estoque</h2>
                        <button onclick="openProductModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-lg font-medium transition"><i class="fa-solid fa-plus"></i> Adicionar</button>
                    </div>
                    <div class="space-y-2">
                        ${state.products.length === 0 ? '<p class="text-xs text-slate-500 text-center py-8">Nenhum produto cadastrado.</p>' : ''}
                        ${state.products.map((p, idx) => `
                            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-between items-center">
                                <div>
                                    <p class="font-semibold text-sm text-white">${p.name}</p>
                                    <p class="text-xs text-slate-400">SKU: ${p.sku || 'N/A'} | Qtd: <span class="text-emerald-400 font-bold">${p.qty}</span></p>
                                    <p class="text-xs text-slate-400">Custo: R$ ${parseFloat(p.cost).toFixed(2)} | Venda: R$ ${parseFloat(p.price).toFixed(2)}</p>
                                </div>
                                <button onclick="deleteProduct(${idx})" class="text-rose-400 hover:text-rose-300 p-2"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function openProductModal() {
            const name = prompt('Nome do Produto:');
            if (!name) return;
            const sku = prompt('Código SKU:') || 'SKU-' + Math.floor(Math.random()*1000);
            const cost = parseFloat(prompt('Preço de Custo (R$):') || 0);
            const price = parseFloat(prompt('Preço de Venda (R$):') || 0);
            const qty = parseInt(prompt('Quantidade em Estoque:') || 0);

            state.products.push({ name, sku, cost, price, qty });
            saveState();
            render();
        }

        function deleteProduct(idx) {
            if (confirm('Deseja excluir este produto?')) {
                state.products.splice(idx, 1);
                saveState();
                render();
            }
        }

        function renderNotebook() {
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="font-bold text-base text-slate-200">Caderneta de Clientes (Fiados)</h2>
                        <button onclick="openCustomerModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-lg font-medium transition"><i class="fa-solid fa-user-plus"></i> Novo Cliente</button>
                    </div>
                    <div class="space-y-2">
                        ${state.customers.length === 0 ? '<p class="text-xs text-slate-500 text-center py-8">Nenhum cliente na caderneta.</p>' : ''}
                        ${state.customers.map((c, idx) => `
                            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-between items-center">
                                <div>
                                    <p class="font-semibold text-sm text-white">${c.name}</p>
                                    <p class="text-xs text-slate-400">Tel: ${c.phone || 'Não informado'}</p>
                                    <p class="text-xs font-bold text-rose-400 mt-1">Dívida: R$ ${parseFloat(c.debt).toFixed(2)}</p>
                                </div>
                                <div class="flex items-center gap-1">
                                    <button onclick="sendWhatsApp(${idx})" class="bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-400 p-2 rounded-lg text-xs" title="Enviar WhatsApp"><i class="fa-brands fa-whatsapp text-base"></i></button>
                                    <button onclick="editDebt(${idx})" class="bg-slate-700 hover:bg-slate-600 text-white p-2 rounded-lg text-xs" title="Ajustar Dívida"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="deleteCustomer(${idx})" class="text-rose-400 hover:text-rose-300 p-2"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function openCustomerModal() {
            const name = prompt('Nome do Cliente:');
            if (!name) return;
            const phone = prompt('Telefone (com DDD para WhatsApp):') || '';
            const debt = parseFloat(prompt('Valor inicial do Fiado (R$):') || 0);

            state.customers.push({ name, phone, debt });
            saveState();
            render();
        }

        function editDebt(idx) {
            const c = state.customers[idx];
            const val = prompt(`Cliente: ${c.name}\nDívida atual: R$ ${c.debt}\nDigite o novo valor total do fiado ou valor a somar/subtrair:`, c.debt);
            if (val !== null) {
                c.debt = parseFloat(val) || 0;
                saveState();
                render();
            }
        }

        function deleteCustomer(idx) {
            if (confirm('Deseja excluir este cliente da caderneta?')) {
                state.customers.splice(idx, 1);
                saveState();
                render();
            }
        }

        function sendWhatsApp(idx) {
            const c = state.customers[idx];
            if (!c.phone) {
                alert('Cliente sem telefone cadastrado!');
                return;
            }
            const msg = encodeURIComponent(`Olá ${c.name}, passando para lembrar do seu saldo em aberto no Drop Mod no valor de R$ ${parseFloat(c.debt).toFixed(2)}. Entre em contato para acertarmos!`);
            window.open(`https://api.whatsapp.com/send?phone=55${c.phone.replace(/\D/g, '')}&text=${msg}`, '_blank');
        }

        function renderSystem() {
            return `
                <div class="space-y-4">
                    <h2 class="font-bold text-base text-slate-200">Sistema & Configurações</h2>
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                        <p class="text-xs font-semibold text-emerald-400">Backup & Restauração (JSON)</p>
                        <div class="flex gap-2">
                            <button onclick="exportData()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-xs py-2 rounded-lg text-white font-medium transition">Exportar Backup</button>
                            <button onclick="importData()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-xs py-2 rounded-lg text-white font-medium transition">Importar Backup</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "drop_mod_backup.json");
            dlAnchorElem.click();
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.readAsText(file, 'UTF-8');
                reader.onload = readerEvent => {
                    try {
                        const imported = JSON.parse(readerEvent.target.result);
                        if (imported.users && imported.products && imported.customers) {
                            state.users = imported.users;
                            state.products = imported.products;
                            state.customers = imported.customers;
                            saveState();
                            render();
                            alert('Backup restaurado com sucesso!');
                        } else {
                            alert('Arquivo de backup inválido.');
                        }
                    } catch (err) {
                        alert('Erro ao ler o arquivo JSON.');
                    }
                }
            };
            input.click();
        }

        function showRecoveryModal() {
            const key = prompt('Digite a Chave de Recuperação de Emergência:');
            const userObj = state.users.find(x => x.recoveryKey === key);
            if (userObj) {
                const newPin = prompt(`Chave válida! Digite um novo PIN para o usuário "${userObj.username}":`);
                if (newPin) {
                    userObj.pin = newPin;
                    saveState();
                    alert('PIN alterado com sucesso! Faça login com a nova senha.');
                    render();
                }
            } else {
                alert('Chave de recuperação incorreta!');
            }
        }

        render();
    </script>
</body>
</html>
